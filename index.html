<title>My Website</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f5f7fa;
        color: #222;
    }

    header {
        background: #1e3a8a;
        padding: 20px 50px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    header h1 {
        color: white;
    }

    nav a {
        color: white;
        text-decoration: none;
        margin-left: 25px;
    }

    nav a:hover {
        color: #dbeafe;
    }

    .hero {
        min-height: 70vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 30px;
    }

    .hero h2 {
        font-size: 45px;
        color: #1e3a8a;
        margin-bottom: 15px;
    }

    .hero p {
        font-size: 18px;
        color: #555;
        max-width: 600px;
        margin-bottom: 25px;
    }

    .button {
        background: #1e3a8a;
        color: white;
        padding: 13px 28px;
        border-radius: 6px;
        text-decoration: none;
        display: inline-block;
    }

    .button:hover {
        background: #162d6b;
    }

    .section {
        padding: 50px 20px;
        text-align: center;
        background: white;
    }

    .section h2 {
        color: #1e3a8a;
        margin-bottom: 15px;
    }

    footer {
        background: #1e3a8a;
        color: white;
        text-align: center;
        padding: 20px;
    }
</style>
```

</head>

<header>

    </nav>
</header>

<section class="hero">
    <h2>Welcome to My Website</h2>

    <p>
        This website is created using HTML and internal CSS
        and hosted using GitHub Pages.
    </p>

    <a href="#about" class="button">Explore</a>
</section>

<section class="section" id="about">

    <p>
        This is my project website. More information

    </p>
</section>

<footer id="contact">

</footer>
